# Translation of the upstream CI workflow. See docs/MIGRATION.md §7 for the
# job-by-job mapping; `are-the-types-wrong` has no Go counterpart because there
# is no dual ESM/CJS packaging problem to detect.

name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    name: Lint, Test & Build on Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.24.x']

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      # Read existing version, reuse that, add a Git short hash
      - name: Set build version to Git commit
        run: ./scripts/version.sh $(git rev-parse --short HEAD)

      - name: Run linter
        run: make lint

      - name: Build
        run: make build

      - name: Test
        run: make test

  test-versions:
    name: Test with Go ${{ matrix.go }}
    needs: [build]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The upstream matrix spans every TypeScript release the package
        # supports. The Go analogue is every Go toolchain at or above the
        # version declared in go.mod.
        go: ['1.22.x', '1.23.x', '1.24.x']

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Show toolchain version
        run: go version

      - name: Test
        run: go test -race ./...

  test-consumer:
    name: Test External Consumer on ${{ matrix.os }}
    needs: [build]
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # The upstream matrix builds the packed artifact into eight app
        # templates. The one meaningful Go analogue is building the library
        # from a separate module; the axis that actually varies is the OS.
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Build the consumer module
        working-directory: ./examples/consumer
        run: go build ./...

      - name: Test the consumer module
        working-directory: ./examples/consumer
        run: go test ./...

  vet-examples:
    name: Vet and run the ported README examples
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Vet
        run: go vet ./examples/...

      - name: Run the examples
        run: |
          go run ./examples/counter
          go run ./examples/extraargument
          go run ./examples/sandwich
